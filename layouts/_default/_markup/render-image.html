{{- $alt := .Text | plainify -}}
{{- with .Page.Resources.GetMatch .Destination -}}
  {{- $image := . -}}
  {{- if gt .Width 1600 -}}
    {{- $image = .Resize "1600x webp q90" -}}
  {{- end -}}
  <img
    src="{{ $image.RelPermalink }}"
    width="{{ $image.Width }}"
    height="{{ $image.Height }}"
    alt="{{ $alt }}"
    loading="lazy"
    decoding="async"
    {{- with $.Title }} title="{{ . }}"{{ end }}>
{{- else -}}
  <img
    src="{{ .Destination | safeURL }}"
    alt="{{ $alt }}"
    loading="lazy"
    decoding="async"
    {{- with .Title }} title="{{ . }}"{{ end }}>
{{- end -}}
