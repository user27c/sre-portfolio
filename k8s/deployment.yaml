apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-portfolio
  namespace: default
  labels:
    app: blog-portfolio
spec:
  replicas: 2 # 双副本冗余；完整 HA 还依赖多节点、PDB 与拓扑分散
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: blog-portfolio
  template:
    metadata:
      labels:
        app: blog-portfolio
    spec:
      # 安全规范：禁止特权容器运行，限制运行用户
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # Nginx alpine 默认的 nginx 用户 UID
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: blog-portfolio
      containers:
        - name: blog-web
          image: registry.cn-chengdu.aliyuncs.com/user27c/blog-portfolio:sha-CHANGE_ME
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          # 资源限制与预约 (SRE 资源管理必备)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # 健康检查探针 (Liveness / Readiness)
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: blog-portfolio-svc
  namespace: default
  labels:
    app: blog-portfolio
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: blog-portfolio
  type: ClusterIP
