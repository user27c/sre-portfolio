<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="advisoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="controlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="deniedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f85149" />
      <stop offset="100%" stop-color="#da3633" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">AEGISOPS ARCHITECTURE &amp; CONTROL BOUNDARY</text>
  <text x="600" y="66" fill="#8b949e" font-size="13" text-anchor="middle">建议权与执行权严格物理隔离 · 确定性策略门禁 · 唯一类型化执行入口</text>

  <!-- Signal Box (Top Left) -->
  <g transform="translate(40, 95)">
    <rect width="220" height="240" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="220" height="32" rx="8" fill="#21262d" />
    <text x="110" y="21" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">1. 信号捕获与事实源</text>
    
    <rect x="20" y="50" width="180" height="42" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1" />
    <text x="110" y="68" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">Alertmanager</text>
    <text x="110" y="84" fill="#8b949e" font-size="10" text-anchor="middle">Firing 告警 Webhook</text>

    <path d="M 110 92 L 110 110" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="20" y="112" width="180" height="42" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1" />
    <text x="110" y="130" fill="#f0f6fc" font-size="12" font-weight="600" text-anchor="middle">Alert Gateway</text>
    <text x="110" y="146" fill="#8b949e" font-size="10" text-anchor="middle">指纹去重 / 状态映射</text>

    <path d="M 110 154 L 110 172" stroke="#58a6ff" stroke-width="1.5" />

    <rect x="20" y="174" width="180" height="48" rx="6" fill="#1f293d" stroke="#58a6ff" stroke-width="1.5" />
    <text x="110" y="194" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">AIOpsIncident CR</text>
    <text x="110" y="210" fill="#a5d6ff" font-size="10" text-anchor="middle">状态机唯一事实源</text>
  </g>

  <!-- Advisory Plane (Top Right) -->
  <g transform="translate(300, 95)">
    <rect width="860" height="240" rx="8" fill="url(#advisoryGrad)" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#shadow)" />
    <rect width="860" height="32" rx="8" fill="#2d2200" />
    <text x="430" y="21" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">2. ADVISORY PLANE (建议面) · 严格只读 · 无 KUBECONFIG · 无写权限</text>

    <!-- Evidence Collector -->
    <rect x="30" y="60" width="180" height="150" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="120" y="85" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">多源证据快照</text>
    <text x="120" y="105" fill="#8b949e" font-size="11" text-anchor="middle">Evidence Snapshot</text>
    <line x1="45" y1="115" x2="195" y2="115" stroke="#30363d" />
    <text x="50" y="135" fill="#7ee787" font-size="10">✓ K8s Pod / Event</text>
    <text x="50" y="153" fill="#7ee787" font-size="10">✓ PromQL 内存峰值</text>
    <text x="50" y="171" fill="#7ee787" font-size="10">✓ Loki 日志片段</text>
    <text x="50" y="189" fill="#8b949e" font-size="10">✓ SHA-256 冻结落盘</text>

    <!-- Runbook RAG -->
    <rect x="245" y="60" width="170" height="150" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="330" y="85" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">Runbook RAG</text>
    <text x="330" y="105" fill="#8b949e" font-size="11" text-anchor="middle">向量检索增强</text>
    <line x1="260" y1="115" x2="400" y2="115" stroke="#30363d" />
    <text x="260" y="135" fill="#e3b341" font-size="10">✓ pgvector 嵌入检索</text>
    <text x="260" y="153" fill="#e3b341" font-size="10">✓ 6 类标准排障手册</text>
    <text x="260" y="171" fill="#e3b341" font-size="10">✓ 拓扑与规则过滤</text>
    <text x="260" y="189" fill="#8b949e" font-size="10">✓ 确定性 Top-K 召回</text>

    <!-- LLM Engine -->
    <rect x="450" y="60" width="180" height="150" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5" />
    <text x="540" y="85" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">DeepSeek / Fake</text>
    <text x="540" y="105" fill="#e3b341" font-size="11" text-anchor="middle">结构化推断引擎</text>
    <line x1="465" y1="115" x2="615" y2="115" stroke="#30363d" />
    <text x="465" y="135" fill="#f0f6fc" font-size="10">输入: 证据 + Runbook</text>
    <text x="465" y="153" fill="#f0f6fc" font-size="10">输出: JSON Schema</text>
    <text x="465" y="171" fill="#f85149" font-size="10">禁止: 任意文本 / 命令</text>
    <text x="465" y="189" fill="#8b949e" font-size="10">无 Kubeconfig / 无写权</text>

    <!-- Reviewer & Contract -->
    <rect x="665" y="60" width="165" height="150" rx="6" fill="#161b22" stroke="#388bfd" />
    <text x="747" y="85" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">Reviewer 审查</text>
    <text x="747" y="105" fill="#58a6ff" font-size="11" text-anchor="middle">确定性决策合同</text>
    <line x1="680" y1="115" x2="815" y2="115" stroke="#30363d" />
    <text x="680" y="135" fill="#7ee787" font-size="10">✓ 5 种 Typed Actions</text>
    <text x="680" y="153" fill="#7ee787" font-size="10">✓ 参数范围合规校验</text>
    <text x="680" y="171" fill="#7ee787" font-size="10">✓ 危险动作 100% 阻断</text>
    <text x="680" y="189" fill="#8b949e" font-size="10">✓ 生成 planDigest</text>
  </g>

  <!-- DENIED BARRIER (Physical Boundary) -->
  <g transform="translate(40, 355)">
    <rect width="1120" height="42" rx="6" fill="#381014" stroke="#f85149" stroke-width="1.5" stroke-dasharray="8,4" />
    <text x="560" y="26" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">
      ⛔ SECURITY BOUNDARY: LLM → KUBERNETES DIRECT WRITE ACCESS = DENIED (彻底无写权限)
    </text>
  </g>

  <!-- Deterministic Control Plane (Bottom) -->
  <g transform="translate(40, 415)">
    <rect width="1120" height="230" rx="8" fill="url(#controlGrad)" stroke="#238636" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="1120" height="32" rx="8" fill="#0d2d14" />
    <text x="560" y="21" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">3. DETERMINISTIC CONTROL PLANE (确定性控制面) · 唯一集群写操作路径</text>

    <!-- Policy Gate -->
    <rect x="30" y="55" width="230" height="150" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="145" y="80" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">RemediationPolicy</text>
    <text x="145" y="100" fill="#8b949e" font-size="11" text-anchor="middle">确定性风险分级门禁</text>
    <line x1="45" y1="110" x2="245" y2="110" stroke="#30363d" />
    <text x="50" y="130" fill="#7ee787" font-size="10">✓ Low Risk: 自动放行 (Restart)</text>
    <text x="50" y="150" fill="#e3b341" font-size="10">✓ Med Risk: 强制审批 (Patch/Scale)</text>
    <text x="50" y="170" fill="#f85149" font-size="10">✓ High/Unmatched: Fail-Closed</text>
    <text x="50" y="190" fill="#8b949e" font-size="10">✓ 冻结 approvalTTL</text>

    <!-- Approval Gate -->
    <rect x="290" y="55" width="230" height="150" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.5" />
    <text x="405" y="80" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">Human-in-the-Loop</text>
    <text x="405" y="100" fill="#e3b341" font-size="11" text-anchor="middle">不可复用方案审批</text>
    <line x1="305" y1="110" x2="505" y2="110" stroke="#30363d" />
    <text x="310" y="130" fill="#f0f6fc" font-size="10">✓ 强绑定 planDigest</text>
    <text x="310" y="150" fill="#f0f6fc" font-size="10">✓ 绑定 targetResourceVersion</text>
    <text x="310" y="170" fill="#f0f6fc" font-size="10">✓ 绑定 policyGeneration</text>
    <text x="310" y="190" fill="#ff7b72" font-size="10">✓ 目标漂移立即废弃失效</text>

    <!-- Typed Executor -->
    <rect x="550" y="55" width="260" height="150" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5" />
    <text x="680" y="80" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">Typed Executor</text>
    <text x="680" y="100" fill="#3fb950" font-size="11" text-anchor="middle">唯一写入口 (5 种 Action)</text>
    <line x1="565" y1="110" x2="795" y2="110" stroke="#30363d" />
    <text x="570" y="130" fill="#7ee787" font-size="10">1. Preflight: 锁竞争与版本前置核验</text>
    <text x="570" y="150" fill="#7ee787" font-size="10">2. Snapshot: 留存 256Mi 状态快照</text>
    <text x="570" y="170" fill="#7ee787" font-size="10">3. Apply: 类型化变更 384Mi</text>
    <text x="570" y="190" fill="#7ee787" font-size="10">4. Verify / Rollback: 健康核验与回滚</text>

    <!-- Verification & Audit -->
    <rect x="840" y="55" width="250" height="150" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="965" y="80" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">闭环验证与审计链</text>
    <text x="965" y="100" fill="#8b949e" font-size="11" text-anchor="middle">Verify &amp; Hash-Chained Audit</text>
    <line x1="855" y1="110" x2="1075" y2="110" stroke="#30363d" />
    <text x="860" y="130" fill="#7ee787" font-size="10">✓ 持续探针核验 (PodReady/cgroup)</text>
    <text x="860" y="150" fill="#7ee787" font-size="10">✓ 通过: 状态推进至 Resolved</text>
    <text x="860" y="170" fill="#f85149" font-size="10">✓ 失败: 触发原子 Snapshot 回滚</text>
    <text x="860" y="190" fill="#58a6ff" font-size="10">✓ 连续 sequence / eventHash 落盘</text>
  </g>
</svg>